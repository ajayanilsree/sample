{% extends 'base.html' %}{% block content %}<div class="narrow"><h1>Add employee</h1><div class="form-card"><p class="muted">Create a login password for this employee. They will use their username and password to sign in.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{% if field.name == 'password' or field.name == 'confirm_password' %}<span class="password-control">{{ field }}<button type="button" class="show-password" aria-label="Show password">Show</button></span>{% else %}{{ field }}{% endif %}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="primary">Create employee</button></form></div></div>{% endblock %}
